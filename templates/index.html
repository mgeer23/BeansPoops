<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Bean's Potty Log</title>
    <style>
        :root {
            --pee-color: #f59e0b;
            --pee-hover: #d97706;
            --poo-color: #92400e;
            --poo-hover: #78350f;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
            --success: #10b981;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --card-bg: #1f2937;
                --text: #f9fafb;
                --text-muted: #9ca3af;
                --border: #374151;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-top: 8px;
        }

        .quick-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-log {
            flex: 1;
            min-height: 80px;
            font-size: 1.4rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            touch-action: manipulation;
            transition: transform 0.1s, opacity 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-log:active { transform: scale(0.96); opacity: 0.9; }

        .btn-pee { background: var(--pee-color); }
        .btn-pee:hover { background: var(--pee-hover); }
        .btn-poo { background: var(--poo-color); }
        .btn-poo:hover { background: var(--poo-hover); }

        .btn-log.success {
            background: var(--success) !important;
        }

        .past-toggle {
            display: block;
            text-align: center;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            user-select: none;
        }

        .past-section {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .past-section.open { display: block; }

        .past-section label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .past-section input[type="datetime-local"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 12px;
            background: var(--bg);
            color: var(--text);
        }

        .past-buttons {
            display: flex;
            gap: 10px;
        }

        .past-buttons .btn-log {
            min-height: 50px;
            font-size: 1.1rem;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .event-row {
            display: flex;
            align-items: center;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            gap: 12px;
        }

        .event-row:first-child { border-radius: 12px 12px 0 0; }
        .event-row:last-child { border-radius: 0 0 12px 12px; }
        .event-row:only-child { border-radius: 12px; }

        .event-icon {
            font-size: 1.5rem;
            width: 36px;
            text-align: center;
            flex-shrink: 0;
        }

        .event-info {
            flex: 1;
            min-width: 0;
        }

        .event-type {
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: capitalize;
        }

        .event-time {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            font-size: 1.1rem;
            touch-action: manipulation;
            border-radius: 8px;
        }

        .btn-delete:hover { color: var(--danger); }

        .load-more {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
        }

        .export-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            padding: 12px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
        }

        .export-link:hover { text-decoration: underline; }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 16px;
            font-size: 0.95rem;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <h1>Bean's Potty Log</h1>

    <div class="quick-buttons">
        <button class="btn-log btn-pee" onclick="logEvent('pee', null, this)">&#128167; Pee</button>
        <button class="btn-log btn-poo" onclick="logEvent('poo', null, this)">&#128169; Poo</button>
    </div>

    <span class="past-toggle" onclick="togglePast()">+ Log a past event</span>

    <div id="past-section" class="past-section">
        <label for="past-time">When did it happen?</label>
        <input type="datetime-local" id="past-time">
        <div class="past-buttons">
            <button class="btn-log btn-pee" onclick="logPastEvent('pee', this)">&#128167; Pee</button>
            <button class="btn-log btn-poo" onclick="logPastEvent('poo', this)">&#128169; Poo</button>
        </div>
    </div>

    <div class="section-title">Recent Activity</div>
    <div id="history" class="history-list"></div>
    <button id="load-more" class="load-more" onclick="loadMore()" style="display:none;">Load more</button>

    <a href="/api/events/export" class="export-link">Download CSV</a>

    <div id="toast" class="toast"></div>

    <script>
        let offset = 0;
        const LIMIT = 50;
        let allLoaded = false;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1500);
        }

        function togglePast() {
            const s = document.getElementById('past-section');
            const toggle = document.querySelector('.past-toggle');
            s.classList.toggle('open');
            if (s.classList.contains('open')) {
                toggle.textContent = '- Hide past event';
                // Pre-fill with current local time
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('past-time').value = now.toISOString().slice(0, 16);
            } else {
                toggle.textContent = '+ Log a past event';
            }
        }

        async function logEvent(type, timestamp, btn) {
            const body = { event_type: type };
            if (timestamp) body.timestamp = timestamp;

            const origText = btn.innerHTML;
            try {
                const res = await fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                if (!res.ok) throw new Error('Failed');

                btn.classList.add('success');
                btn.innerHTML = '&#10003;';
                setTimeout(() => {
                    btn.classList.remove('success');
                    btn.innerHTML = origText;
                }, 800);

                showToast(type === 'pee' ? 'Pee logged!' : 'Poo logged!');
                offset = 0;
                allLoaded = false;
                await loadHistory(true);
            } catch (e) {
                showToast('Error - try again');
                btn.innerHTML = origText;
            }
        }

        function logPastEvent(type, btn) {
            const input = document.getElementById('past-time');
            if (!input.value) {
                showToast('Pick a date & time first');
                return;
            }
            const localDate = new Date(input.value);
            const utc = localDate.toISOString();
            logEvent(type, utc, btn);
        }

        async function loadHistory(replace) {
            if (replace) offset = 0;
            try {
                const res = await fetch(`/api/events?limit=${LIMIT}&offset=${offset}`);
                const events = await res.json();

                const container = document.getElementById('history');
                if (replace) container.innerHTML = '';

                if (events.length === 0 && offset === 0) {
                    container.innerHTML = '<div class="empty-state">No events yet. Tap a button above to start logging!</div>';
                    document.getElementById('load-more').style.display = 'none';
                    return;
                }

                events.forEach(ev => {
                    const row = document.createElement('div');
                    row.className = 'event-row';
                    row.id = `event-${ev.id}`;

                    const icon = ev.event_type === 'pee' ? '&#128167;' : '&#128169;';
                    const localTime = new Date(ev.timestamp).toLocaleString(undefined, {
                        weekday: 'short',
                        month: 'short',
                        day: 'numeric',
                        hour: 'numeric',
                        minute: '2-digit',
                    });

                    row.innerHTML = `
                        <span class="event-icon">${icon}</span>
                        <div class="event-info">
                            <div class="event-type">${ev.event_type}</div>
                            <div class="event-time">${localTime}</div>
                        </div>
                        <button class="btn-delete" onclick="deleteEvent(${ev.id})" title="Delete">&#128465;</button>
                    `;
                    container.appendChild(row);
                });

                offset += events.length;
                document.getElementById('load-more').style.display =
                    events.length < LIMIT ? 'none' : 'block';
            } catch (e) {
                showToast('Error loading history');
            }
        }

        function loadMore() {
            loadHistory(false);
        }

        async function deleteEvent(id) {
            if (!confirm('Delete this event?')) return;
            try {
                await fetch(`/api/events/${id}`, { method: 'DELETE' });
                const row = document.getElementById(`event-${id}`);
                if (row) row.remove();
                showToast('Deleted');
            } catch (e) {
                showToast('Error deleting');
            }
        }

        // Load history on page load
        loadHistory(true);
    </script>
</body>
</html>
